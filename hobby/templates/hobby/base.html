{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Moje hobby{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'hobby/style.css' %}">
</head>
<body>
<header>
    <h1>Moje hobby</h1>
    <nav>
        <nav>
            <a href="{% url 'home' %}"
               class="{% if request.path == '/' %}active{% endif %}">Start</a>
            <a href="{% url 'about' %}"
               class="{% if request.path == '/about/' %}active{% endif %}">O hobby</a>
            <a href="{% url 'gallery' %}"
               class="{% if request.path == '/gallery/' %}active{% endif %}">Galeria</a>
        </nav>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
